name: Verify standalone SurgeArrest release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python edge_driver/test_driver.py
      - run: python -m unittest discover -s tests -v
      - run: python esp_bridge/test_firmware.py
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
      - run: pio run -d esp_bridge
      - uses: actions/upload-artifact@v4
        with:
          name: SurgeArrest-ESP32-build
          path: |
            esp_bridge/.pio/build/esp32-wroom-32d/firmware.bin
            esp_bridge/.pio/build/esp32-wroom-32d/bootloader.bin
            esp_bridge/.pio/build/esp32-wroom-32d/partitions.bin
